[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "laya-mlx-voice-browser"
version = "0.1.0"
description = "Voice-controlled Safari with local Laya-MLX typed decisions on Apple silicon"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aryan Bhujade" }]
dependencies = [
  "laya-mlx>=0.2.0,<1",
  "selenium>=4.35,<5",
  "websockets>=13,<17",
]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<1"]

[project.scripts]
laya-voice-browser = "laya_voice_browser.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_voice_browser"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
